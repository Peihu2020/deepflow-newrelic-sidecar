name: Build and Publish Go Project via ACA Job Runner

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: [self-hosted, linux, aca-runner]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Azure via Managed Identity
        run: az login --identity
        

      - name: Verify Go toolchain
        run: go version

      - name: Build Go project
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/app .

      - name: Build and push image via az acr build
        env:
          ACR_NAME: pocgithubacr
          IMAGE_REPO: deepflow-newrelic-sidecar
          IMAGE_TAG: ${{ github.sha }}
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "${IMAGE_REPO}:${IMAGE_TAG}" \
            --image "${IMAGE_REPO}:latest" \
            --file Dockerfile \
            .
