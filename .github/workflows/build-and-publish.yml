name: Build and Publish Go Project via ACA Job Runner

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: [self-hosted, linux, aca-runner]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Azure via Managed Identity
        run: az login --identity
        
      - name: Diagnose Runner identity and ACR connectivity
        env:
          ACR_NAME: pocgithubacr
          ACR_LOGIN_SERVER: pocgithubacr.azurecr.io
        run: |
          echo "=== Azure Account ==="
          az account show --query "{name:name, id:id, tenantId:tenantId, user:user}" -o json || true

          echo "=== Test ARM / AAD Token ==="
          az account get-access-token --resource-type arm --query "{expiresOn:expiresOn, tokenType:tokenType}" -o json || true

          echo "=== DNS & Proxy ==="
          getent hosts "${ACR_LOGIN_SERVER}" || nslookup "${ACR_LOGIN_SERVER}" || true
          env | grep -iE 'proxy|az_' || true

          echo "=== Verbose ACR expose-token ==="
          az acr login --name "${ACR_NAME}" --expose-token --debug || true

      - name: Verify Go toolchain
        run: go version

      - name: Build Go project
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/app .

      - name: Build and publish container image to Private ACR
        env:
          ACR_NAME: pocgithubacr
          ACR_LOGIN_SERVER: pocgithubacr.azurecr.io
          IMAGE_NAME: deepflow-newrelic-sidecar
          IMAGE_TAG: ${{ github.sha }}
        run: |
          TOKEN=$(az acr login --name "$ACR_NAME" --expose-token --query accessToken --output tsv)
          if [ -z "$TOKEN" ]; then
            echo "Failed to acquire ACR access token"
            exit 1
          fi

          AUTH_B64=$(printf "00000000-0000-0000-0000-000000000000:%s" "$TOKEN" | base64 | tr -d '\n')
          mkdir -p /kaniko/.docker
          cat <<EOF > /kaniko/.docker/config.json
          {
            "auths": {
              "${ACR_LOGIN_SERVER}": {
                "auth": "${AUTH_B64}"
              }
            }
          }
          EOF

          /kaniko/executor \
            --context "${GITHUB_WORKSPACE}" \
            --dockerfile "${GITHUB_WORKSPACE}/Dockerfile" \
            --destination "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}" \
            --destination "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest"
            --destination "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}" \
            --destination "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest"
